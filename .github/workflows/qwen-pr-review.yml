name: Qwen PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: qwen-pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    name: Review Pull Request
    runs-on: ubuntu-latest
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.body == '@qwencoder /review' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    steps:
      - name: Load PR metadata
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number =
              context.eventName === "pull_request"
                ? context.payload.pull_request.number
                : context.issue.number;
            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
            });

            core.setOutput("number", String(pr.data.number));
            core.setOutput("base_sha", pr.data.base.sha);
            core.setOutput("base_ref", pr.data.base.ref);
            core.setOutput("head_sha", pr.data.head.sha);
            core.setOutput("head_ref", pr.data.head.ref);
            core.setOutput("head_repo", pr.data.head.repo.full_name);
            core.setOutput("title", pr.data.title);
            core.setOutput(
              "same_repo",
              String(pr.data.head.repo.full_name === `${owner}/${repo}`),
            );

      - name: Refuse fork PRs
        if: steps.pr.outputs.same_repo != 'true'
        run: |
          echo "Fork pull requests are not reviewed by this workflow."

      - name: Check out PR head
        if: steps.pr.outputs.same_repo == 'true'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 0

      - name: Fetch base and head refs
        if: steps.pr.outputs.same_repo == 'true'
        env:
          PR_BASE_REF: ${{ steps.pr.outputs.base_ref }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      - name: Build review inputs
        if: steps.pr.outputs.same_repo == 'true'
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
        run: |
          git diff --unified=3 "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/pr.diff"
          git diff --stat "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/pr.diffstat"

          {
            cat .github/prompts/qwen-pr-review.md
            printf '\n\nPR metadata:\n'
            printf 'PR number: %s\n' "$PR_NUMBER"
            printf 'PR title: %s\n' "$PR_TITLE"
            printf 'Base SHA: %s\n' "$BASE_SHA"
            printf 'Head SHA: %s\n' "$HEAD_SHA"
            printf '\nDiffstat:\n'
            cat "$RUNNER_TEMP/pr.diffstat"
          } > "$RUNNER_TEMP/qwen-prompt.txt"

      - name: Set up Node.js
        if: steps.pr.outputs.same_repo == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Qwen Code CLI
        if: steps.pr.outputs.same_repo == 'true'
        env:
          QWEN_CLI_VERSION: ${{ vars.QWEN_CLI_VERSION || 'latest' }}
        run: npm install --global "@qwen-code/qwen-code@$QWEN_CLI_VERSION"

      - name: Run Qwen review
        if: steps.pr.outputs.same_repo == 'true'
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
          QWEN_MODEL: ${{ vars.QWEN_MODEL }}
        run: |
          test -n "$QWEN_API_KEY"
          test -n "$QWEN_BASE_URL"
          test -n "$QWEN_MODEL"

          cat "$RUNNER_TEMP/pr.diff" | qwen \
            --auth-type openai \
            --openai-api-key "$QWEN_API_KEY" \
            --openai-base-url "$QWEN_BASE_URL" \
            --model "$QWEN_MODEL" \
            --channel CI \
            --sandbox \
            --approval-mode yolo \
            --prompt "$(cat "$RUNNER_TEMP/qwen-prompt.txt")" \
            --output-format json > "$RUNNER_TEMP/qwen-review.json"

      - name: Extract review text
        if: steps.pr.outputs.same_repo == 'true'
        id: extract
        run: |
          review_text="$(jq -r '
            (map(select(.type == "result" and .subtype == "success")) | last | .result) //
            (map(select(.type == "assistant")) | last | .message.content[]? | select(.type == "text") | .text) //
            empty
          ' "$RUNNER_TEMP/qwen-review.json")"

          if [ -z "$review_text" ]; then
            echo "Failed to extract review text from Qwen output." >&2
            exit 1
          fi

          {
            printf 'body<<EOF\n'
            printf '<!-- qwen-headless-pr-review -->\n'
            printf '## Qwen Headless Review\n\n'
            printf '%s\n' "$review_text"
            printf '\nEOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Upsert PR comment
        if: steps.pr.outputs.same_repo == 'true'
        uses: actions/github-script@v7
        env:
          REVIEW_BODY: ${{ steps.extract.outputs.body }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number("${{ steps.pr.outputs.number }}");
            const marker = "<!-- qwen-headless-pr-review -->";
            const body = process.env.REVIEW_BODY;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );

            const existing = comments.find((comment) =>
              comment.user?.login === "github-actions[bot]" &&
              typeof comment.body === "string" &&
              comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
